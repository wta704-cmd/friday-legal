<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PitchOS</title>
    <meta name="description" content="축구·풋살 퍼포먼스 & 팀 관리 — 일정·투표·라인업·기록" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light" />

    <!-- iOS: open from the home screen without Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PitchOS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-frame">
      <main id="app" class="app">
        <div class="boot">
          <div class="boot-logo">P</div>
          <p>PitchOS</p>
        </div>
      </main>
      <nav id="tabbar" class="tabbar" hidden aria-label="주요 탭"></nav>
    </div>
    <div id="toast-host"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        PitchOS 웹은 JavaScript가 필요합니다. Safari 설정에서 JavaScript를 켜 주세요.
      </p>
    </noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
